components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties: { status: { type: string } }

    User:
      type: object
      required: [id, email, name, roles]
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: string }
        avatarUrl: { type: ["string", "null"] }
        roles:
          type: array
          items: { type: string, enum: [admin, project_manager, engineer, accountant, procurement_officer, viewer] }
        activeRole: { type: string, enum: [admin, project_manager, engineer, accountant, procurement_officer, viewer] }
    SwitchRoleRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [admin, project_manager, engineer, accountant, procurement_officer, viewer] }
    UpdateRolesRequest:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          items: { type: string }

    DashboardSummary:
      type: object
      required: [totals, projectsByStatus, tasksByStatus, financials, procurement, leadFunnel]
      properties:
        totals:
          type: object
          required: [projects, leads, tasks, vendors]
          properties:
            projects: { type: integer }
            leads: { type: integer }
            tasks: { type: integer }
            vendors: { type: integer }
        projectsByStatus:
          type: array
          items:
            type: object
            required: [status, count]
            properties: { status: { type: string }, count: { type: integer } }
        tasksByStatus:
          type: array
          items:
            type: object
            required: [status, count]
            properties: { status: { type: string }, count: { type: integer } }
        financials:
          type: object
          required: [totalBudget, totalExpenses, totalInvoiced, totalPaid, overdueInvoices]
          properties:
            totalBudget: { type: number }
            totalExpenses: { type: number }
            totalInvoiced: { type: number }
            totalPaid: { type: number }
            overdueInvoices: { type: integer }
        procurement:
          type: object
          required: [activePos, pendingRequests, lowStockMaterials]
          properties:
            activePos: { type: integer }
            pendingRequests: { type: integer }
            lowStockMaterials: { type: integer }
        leadFunnel:
          type: array
          items:
            type: object
            required: [stage, count, value]
            properties:
              stage: { type: string }
              count: { type: integer }
              value: { type: number }
    ActivityItem:
      type: object
      required: [id, type, title, description, createdAt]
      properties:
        id: { type: integer }
        type: { type: string }
        title: { type: string }
        description: { type: string }
        createdAt: { type: string, format: date-time }

    Lead:
      type: object
      required: [id, leadNumber, customerName, status, stage, priority, createdAt]
      properties:
        id: { type: integer }
        leadNumber: { type: string }
        customerName: { type: string }
        company: { type: ["string", "null"] }
        contactEmail: { type: ["string", "null"] }
        contactPhone: { type: ["string", "null"] }
        projectType: { type: ["string", "null"] }
        location: { type: ["string", "null"] }
        budgetEstimate: { type: ["number", "null"] }
        leadSource: { type: ["string", "null"] }
        status: { type: string, enum: [new, contacted, qualified, lost, won] }
        stage: { type: string, enum: [lead_creation, site_visit, drawings, boq, negotiation, finalization] }
        priority: { type: string, enum: [urgent, high, medium, low] }
        ownerId: { type: ["integer", "null"] }
        ownerName: { type: ["string", "null"] }
        expectedClosureDate: { type: ["string", "null"], format: date }
        wonProjectId: { type: ["integer", "null"] }
        notes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    LeadInput:
      type: object
      required: [customerName]
      properties:
        customerName: { type: string }
        company: { type: ["string", "null"] }
        contactEmail: { type: ["string", "null"] }
        contactPhone: { type: ["string", "null"] }
        projectType: { type: ["string", "null"] }
        location: { type: ["string", "null"] }
        budgetEstimate: { type: ["number", "null"] }
        leadSource: { type: ["string", "null"] }
        status: { type: ["string", "null"], enum: [new, contacted, qualified, lost, won, null] }
        stage: { type: ["string", "null"], enum: [lead_creation, site_visit, drawings, boq, negotiation, finalization, null] }
        priority: { type: ["string", "null"], enum: [urgent, high, medium, low, null] }
        ownerId: { type: ["integer", "null"] }
        expectedClosureDate: { type: ["string", "null"], format: date }
        wonProjectId: { type: ["integer", "null"] }
        notes: { type: ["string", "null"] }
    LeadDetail:
      allOf:
