openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Kanak Turnkey Projects API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: users
  - name: leads
  - name: lead-activities
  - name: site-visits
  - name: drawings
  - name: boqs
  - name: negotiations
  - name: projects
  - name: tasks
  - name: budgets
  - name: ra-bills
  - name: expenses
  - name: invoices
  - name: vendor-invoices
  - name: financial-instruments
  - name: vendors
  - name: material-requests
  - name: rfqs
  - name: purchase-orders
  - name: materials
  - name: stakeholders
  - name: communications
  - name: meetings
  - name: documents
  - name: notifications
  - name: audit-logs
