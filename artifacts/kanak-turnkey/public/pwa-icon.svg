<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#grad)" filter="url(#shadow)"/>

  <!-- Subtle grid lines resembling architectural blueprint -->
  <path d="M 64 128 L 448 128 M 64 256 L 448 256 M 64 384 L 448 384" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <path d="M 128 64 L 128 448 M 256 64 L 256 448 M 384 64 L 384 448" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Construction Helmet Icon -->
  <g transform="translate(106, 110)">
    <!-- Helmet dome -->
    <path d="M 150 40 C 70 40 10 95 10 170 C 10 185 20 195 35 195 L 265 195 C 280 195 290 185 290 170 C 290 95 230 40 150 40 Z" fill="url(#gold)"/>
    <!-- Helmet rim -->
    <path d="M 0 195 C 0 195 25 180 150 180 C 275 180 300 195 300 195 C 310 195 315 205 305 215 C 270 240 30 240 -5 215 C -15 205 -10 195 0 195 Z" fill="#b45309"/>
    <!-- Helmet ridge / crest -->
    <rect x="135" y="30" width="30" height="150" rx="10" fill="#fef3c7" opacity="0.6"/>
  </g>

  <!-- DPR Document / Mobile Clipboard Badge -->
  <g transform="translate(230, 250)">
    <rect width="180" height="200" rx="18" fill="#ffffff" filter="url(#shadow)"/>
    <rect x="50" y="-12" width="80" height="26" rx="8" fill="#3b82f6"/>
    <!-- Checklist items inside clipboard -->
    <circle cx="36" cy="48" r="10" fill="#10b981"/>
    <path d="M 31 48 L 35 52 L 41 44" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="58" y="42" width="94" height="12" rx="4" fill="#cbd5e1"/>

    <circle cx="36" cy="88" r="10" fill="#10b981"/>
    <path d="M 31 88 L 35 92 L 41 84" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="58" y="82" width="80" height="12" rx="4" fill="#cbd5e1"/>

    <circle cx="36" cy="128" r="10" fill="#3b82f6"/>
    <rect x="58" y="122" width="102" height="12" rx="4" fill="#cbd5e1"/>

    <circle cx="36" cy="168" r="10" fill="#f59e0b"/>
    <rect x="58" y="162" width="70" height="12" rx="4" fill="#cbd5e1"/>
  </g>

  <!-- Offline Lightning / Sync Badge -->
  <circle cx="410" cy="110" r="48" fill="#10b981" filter="url(#shadow)"/>
  <path d="M 405 85 L 390 112 L 412 112 L 400 138 L 432 108 L 410 108 Z" fill="#ffffff"/>
</svg>
